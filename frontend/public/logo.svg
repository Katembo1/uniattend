<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Main Circle for Checkmark -->
  <circle cx="256" cy="256" r="150" fill="white" opacity="0.95"/>
  
  <!-- Checkmark -->
  <path d="M 190 256 L 230 300 L 330 200" 
        stroke="url(#checkGradient)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Small building/university icon at bottom -->
  <g transform="translate(256, 380)" opacity="0.95">
    <!-- Simplified building -->
    <rect x="-35" y="-25" width="70" height="50" fill="white" rx="5"/>
    <rect x="-25" y="-20" width="15" height="15" fill="#3498db"/>
    <rect x="10" y="-20" width="15" height="15" fill="#3498db"/>
    <rect x="-25" y="0" width="15" height="15" fill="#3498db"/>
    <rect x="10" y="0" width="15" height="15" fill="#3498db"/>
  </g>
</svg>
